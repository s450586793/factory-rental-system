name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local compose env
        run: cp .env.example .env

      - name: Validate local compose
        run: docker compose -f docker-compose.yml config

      - name: Validate GHCR compose
        run: docker compose -f docker-compose.ghcr.yml config

      - name: Validate web update compose overlay
        env:
          WEB_UPDATE_PROJECT_DIR: /tmp/factory-rental-system
        run: docker compose -f docker-compose.ghcr.yml -f docker-compose.web-update.yml config

      - name: Verify database and attachment backups
        env:
          RESTORE_IMAGE: postgres:16
        run: |
          docker pull "$RESTORE_IMAGE"
          sh scripts/test-backup.sh

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Lint backend
        run: npm run lint

  migration-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: factory_rental
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factory_rental"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_NAME: factory-rental-system
      NODE_ENV: test
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:8080
      JWT_SECRET: ci-secret
      COOKIE_NAME: token
      COOKIE_SECURE: false
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123456
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: factory_rental
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SYNCHRONIZE: false
      STORAGE_ROOT: /tmp/factory-rental-storage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run

      - name: Seed admin user
        run: npm run seed:admin

      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Build worker runtime
        run: npm run build

      - name: Test real database rental workflow
        env:
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_PORT: "5432"
          INTEGRATION_DB_USER: postgres
          INTEGRATION_DB_PASSWORD: postgres
          INTEGRATION_DB_NAME: factory_rental
        run: npm run test:integration

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run type-check

      - name: Build frontend
        run: npm run build

      - name: Run frontend smoke tests
        run: npm test

  build-images:
    runs-on: ubuntu-latest
    needs:
      - validate-compose
      - backend-check
      - migration-smoke
      - frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            build_args: ""
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            build_args: VITE_API_BASE_URL=/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
