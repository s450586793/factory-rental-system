name: Publish Docker Images

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

# 发布串行执行；旧提交即使更晚完成，也不能覆盖当前发布。
concurrency:
  group: production-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful CI for the exact current commit
        uses: actions/github-script@v7
        id: verified
        with:
          script: |
            const branch = context.payload.repository.default_branch;
            const head = await github.rest.repos.getCommit({ ...context.repo, ref: branch });
            const revision = context.payload.workflow_run?.head_sha ?? context.sha;
            if (head.data.sha !== revision) {
              core.setFailed('Only the current default-branch commit can be published');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: revision, event: 'push', status: 'completed', per_page: 100,
            });
            if (!runs.data.workflow_runs.some(run => run.conclusion === 'success' && run.head_sha === revision)) {
              core.setFailed('Successful CI is required for this exact commit');
              return;
            }
            core.setOutput('revision', revision);
            core.setOutput('branch', branch);

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.verified.outputs.revision }}

      - name: Derive release metadata
        id: vars
        env:
          REVISION: ${{ steps.verified.outputs.revision }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(node -e 'const fs = require("fs"); const text = fs.readFileSync("frontend/src/config/app-meta.ts", "utf8"); const version = text.match(/APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]/)?.[1]; if (!version || !/^v?\d+\.\d+\.\d+([-+][\w.-]+)?$/i.test(version)) process.exit(1); process.stdout.write(version);')
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=deploy-${REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}-backend:sha-${{ steps.verified.outputs.revision }}
          labels: org.opencontainers.image.revision=${{ steps.verified.outputs.revision }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: VITE_API_BASE_URL=/api
          tags: ${{ steps.vars.outputs.image }}-frontend:sha-${{ steps.verified.outputs.revision }}
          labels: org.opencontainers.image.revision=${{ steps.verified.outputs.revision }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Verify published pair and prepare immutable manifest
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
          REVISION: ${{ steps.verified.outputs.revision }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}-backend@${BACKEND_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}-frontend@${FRONTEND_DIGEST}"
          for reference in "${IMAGE}-backend@${BACKEND_DIGEST}" "${IMAGE}-frontend@${FRONTEND_DIGEST}"; do
            docker pull "$reference"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference")" = "$REVISION"
          done
          node <<'NODE'
          const fs = require('fs');
          const { IMAGE, VERSION, REVISION, BACKEND_DIGEST, FRONTEND_DIGEST } = process.env;
          if (![BACKEND_DIGEST, FRONTEND_DIGEST].every(value => /^sha256:[a-f0-9]{64}$/.test(value))) process.exit(1);
          fs.writeFileSync('release-manifest.json', JSON.stringify({
            schemaVersion: 1, version: VERSION, revision: REVISION, publishedAt: new Date().toISOString(),
            images: { backend: `${IMAGE}-backend@${BACKEND_DIGEST}`, frontend: `${IMAGE}-frontend@${FRONTEND_DIGEST}` },
          }, null, 2));
          NODE

      - name: Check commit is still current before promotion
        uses: actions/github-script@v7
        env:
          REVISION: ${{ steps.verified.outputs.revision }}
          BRANCH: ${{ steps.verified.outputs.branch }}
        with:
          script: |
            const head = await github.rest.repos.getCommit({ ...context.repo, ref: process.env.BRANCH });
            if (head.data.sha !== process.env.REVISION) core.setFailed('A newer commit superseded this publication');

      - name: Publish complete release and promote latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
          RELEASE: ${{ steps.vars.outputs.release }}
          REVISION: ${{ steps.verified.outputs.revision }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          gh release create "$RELEASE" release-manifest.json --target "$REVISION" --title "$VERSION" --notes "Verified commit: ${REVISION}" --latest=false
          docker buildx imagetools create --tag "${IMAGE}-backend:latest" "${IMAGE}-backend@${BACKEND_DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}-frontend:latest" "${IMAGE}-frontend@${FRONTEND_DIGEST}"
          gh release edit "$RELEASE" --latest

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: github-deploy-bundle
          path: |
            release-manifest.json
            docker-compose.ghcr.yml
            docker-compose.web-update.yml
            docker-compose.yml
            .env.example
            .env.ghcr.example
            docs/env-reference.md
            docs/synology-deploy.md
            docs/database-migrations.md
            docs/database-schema.md
            docs/backup-restore.md
            scripts/backup.sh
            scripts/verify-backup.sh
            README.md
