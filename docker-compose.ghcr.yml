name: factory-rental-system

services:
  postgres:
    image: postgres:16
    container_name: factory-rental-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: factory_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-this-postgres-password
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factory_rental"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ghcr.io/s450586793/factory-rental-system-backend:latest
    container_name: factory-rental-backend
    init: true
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: factory_rental
      DB_USER: postgres
      DB_PASSWORD: change-this-postgres-password
      DB_SYNCHRONIZE: "false"
      APP_NAME: factory-rental-system
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: change-this-jwt-secret
      COOKIE_NAME: token
      COOKIE_SECURE: "true"
      FRONTEND_ORIGIN: https://your-domain.example.com
      API_DOCS_ENABLED: "false"
      STORAGE_ROOT: /app/storage
      PDF_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      WEB_UPDATE_ENABLED: "false"
      WEB_UPDATE_DOCKER_SOCKET: /var/run/docker.sock
      WEB_UPDATE_PROJECT_DIR: /volume1/docker/factory-rental-system
      WEB_UPDATE_COMPOSE_FILES: docker-compose.ghcr.yml
      WEB_UPDATE_RUNNER_IMAGE: docker:27-cli
      WEB_UPDATE_SERVICES: backend,frontend
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-admin-password
    volumes:
      - ./volumes/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ghcr.io/s450586793/factory-rental-system-frontend:latest
    container_name: factory-rental-frontend
    init: true
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8080:80"
