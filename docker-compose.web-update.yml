services:
  backend:
    environment:
      WEB_UPDATE_ENABLED: "true"
      WEB_UPDATE_DOCKER_SOCKET: /var/run/docker.sock
      WEB_UPDATE_PROJECT_DIR: ${WEB_UPDATE_PROJECT_DIR}
      WEB_UPDATE_COMPOSE_FILES: ${WEB_UPDATE_COMPOSE_FILES:-docker-compose.ghcr.yml,docker-compose.web-update.yml}
      WEB_UPDATE_RUNNER_IMAGE: ${WEB_UPDATE_RUNNER_IMAGE:-docker:27-cli}
      WEB_UPDATE_SERVICES: ${WEB_UPDATE_SERVICES:-backend,frontend}
      WEB_UPDATE_PROXY_URL: ${WEB_UPDATE_PROXY_URL:-}
      WEB_UPDATE_NO_PROXY: ${WEB_UPDATE_NO_PROXY:-}
      WEB_UPDATE_ONLINE_VERSION_TIMEOUT_MS: ${WEB_UPDATE_ONLINE_VERSION_TIMEOUT_MS:-5000}
      WEB_UPDATE_ONLINE_VERSION_URL: ${WEB_UPDATE_ONLINE_VERSION_URL:-https://github.com/s450586793/factory-rental-system/releases/latest/download/release-manifest.json}
      WEB_UPDATE_DOCKER_TIMEOUT_MS: ${WEB_UPDATE_DOCKER_TIMEOUT_MS:-120000}
      WEB_UPDATE_TIMEOUT_SECONDS: ${WEB_UPDATE_TIMEOUT_SECONDS:-1800}
      WEB_UPDATE_HEALTH_TIMEOUT_SECONDS: ${WEB_UPDATE_HEALTH_TIMEOUT_SECONDS:-300}
      WEB_UPDATE_BACKUP_ENABLED: ${WEB_UPDATE_BACKUP_ENABLED:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WEB_UPDATE_PROJECT_DIR}:${WEB_UPDATE_PROJECT_DIR}
